name: BORDER OPS 门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # check_version.js / verify.cjs 只依赖 Node 内置模块（fs/vm/path/crypto），
      # 仓库零 npm 依赖，因此这里刻意不跑 npm install —— CI 与本地完全一致。
      - name: 版本一致性门禁
        run: node check_version.js

      - name: 逻辑回归断言
        run: node verify.cjs

      - name: 全量语法检查
        run: |
          for f in src/*.js server.js tools/*.cjs; do
            node --check "$f" || exit 1
          done
          echo "全部脚本语法通过"

      # fixtures 被 verify 组 32 直接读取，缺失会静默退化成 0 样本
      - name: 旧存档样本存在
        run: test -f fixtures/legacy-saves.json && echo "fixtures/legacy-saves.json 存在"
